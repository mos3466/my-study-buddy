<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Study Buddy</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">✦</span><div><b>My Study Buddy</b><small>مساحتك الدراسية الذكية</small></div></div><nav id="nav"><button class="active" data-page="dashboard">⌂ <span>الرئيسية</span></button><button data-page="courses">▤ <span>موادي</span></button><button data-page="calendar">▦ <span>التقويم</span></button><button data-page="planner">☑ <span>خطة المذاكرة</span></button><button data-page="assistant">✧ <span>المساعد الدراسي</span></button><button data-page="settings">⚙ <span>الإعدادات</span></button></nav><div class="side-note">✦ كل إنجاز صغير يقربك لهدفك.</div></aside><main><header><div><div class="eyebrow">YOUR STUDY SPACE</div><h1 id="pageTitle">لوحة التحكم</h1></div><div class="header-actions"><span id="today"></span><button id="addEventTop" class="primary">＋ إضافة موعد</button></div></header><div id="content"></div></main></div><dialog id="eventDialog"><form id="eventForm" class="modal"><div class="modal-header"><h2 id="dialogTitle">إضافة موعد</h2><button type="button" class="close" id="closeDialog">×</button></div><label>العنوان<input name="title" required maxlength="100" placeholder="مثال: ميد الذكاء الاصطناعي"></label><div class="two"><label>النوع<select name="type"><option value="exam">اختبار</option><option value="quiz">كويز</option><option value="project">تسليم مشروع</option><option value="task">مهمة</option></select></label><label>المادة<select name="course" id="eventCourse"></select></label></div><div class="two"><label>التاريخ<input type="date" name="date" required></label><label>الوقت<input type="time" name="time" value="09:00"></label></div><label>المحتوى / ملاحظات<textarea name="notes" rows="3" placeholder="مثال: Chapters 1–4"></textarea></label><div class="modal-actions"><button type="button" id="cancelDialog">إلغاء</button><button type="submit" class="primary">حفظ الموعد</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="script.js"></script></body></html>
